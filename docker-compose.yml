# Optional: local MySQL + MongoDB for development. Matches .env.example.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root_change_me
      MYSQL_DATABASE: apartment_society
      MYSQL_USER: society_user
      MYSQL_PASSWORD: change_me
    ports: ["3306:3306"]
    volumes: ["mysql_data:/var/lib/mysql"]
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: ["mongo_data:/data/db"]
volumes:
  mysql_data:
  mongo_data:
