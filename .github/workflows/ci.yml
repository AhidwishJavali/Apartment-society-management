name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root_change_me
          MYSQL_DATABASE: apartment_society
          MYSQL_USER: society_user
          MYSQL_PASSWORD: change_me
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot_change_me"
          --health-interval=5s --health-timeout=5s --health-retries=20
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    env:
      DATABASE_URL: mysql://society_user:change_me@127.0.0.1:3306/apartment_society
      MONGODB_URI: mongodb://127.0.0.1:27017/apartment_society
      SESSION_SECRET: ci-only-secret-that-is-at-least-thirty-two-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Prepare databases
        run: npm run db:setup
      - name: Integration tests (live MySQL + MongoDB)
        run: npm run test:integration
